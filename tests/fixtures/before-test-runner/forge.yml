# Generated by forge sync for Forge v1.2.33; forge sync rewrites it.
name: forge

on:
  pull_request:
  pull_request_target:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  actions: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    name: ${{ github.event_name == 'pull_request' && 'tests' || 'tests (other event)' }}
    runs-on: "ubuntu-24.04"
    env:
      UV_FROZEN: '1'
      FORGE_GROUP: '1'
      FORGE_GROUPS: '1'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: parent-tests
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_ONLY_EXCLUDES: '[":(exclude,glob).factory/**", ":(exclude,glob)plans/**", ":(exclude,glob).forge/**", ":(exclude,glob)docs/**", ":(exclude,glob,icase)**/*.md", ":(exclude,glob,icase)**/*.png", ":(exclude,glob,icase)**/*.jpg", ":(exclude,glob,icase)**/*.jpeg", ":(exclude,glob,icase)**/*.gif", ":(exclude,glob,icase)**/*.svg", ":(exclude,glob,icase)**/*.webp", ":(exclude,glob,icase)**/*.avif", ":(exclude,glob,icase)**/*.ico", ":(exclude,glob,icase)**/*.bmp", ":(exclude,glob,icase)**/*.tif", ":(exclude,glob,icase)**/*.tiff", ":(exclude,glob,icase)**/*.icns", ":(exclude,glob,icase)**/*.woff", ":(exclude,glob,icase)**/*.woff2", ":(exclude,glob,icase)**/*.ttf", ":(exclude,glob,icase)**/*.otf", ":(exclude,glob,icase)**/*.eot"]'
        run: python .forge/review-tests.py
      - run: uv tool install git+https://github.com/knacklabs/symphony-forge@v1.2.33
        if: steps.parent-tests.outputs.reuse != 'true'
      - run: "forge test --change"
        if: steps.parent-tests.outputs.reuse != 'true'

  forge-pr-check:
    if: github.event_name == 'pull_request_target'
    name: Review pull request
    permissions:
      contents: read
      actions: read
      statuses: write
    runs-on: "ubuntu-24.04"
    steps:
      # The base branch's code and forge.toml; the pull request's commits are only data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            git fetch --no-tags origin "refs/pull/$PR/head"
            fetched=$(git rev-parse FETCH_HEAD)
            [ "$fetched" = "$HEAD_SHA" ] && break
            [ "$attempt" = 7 ] || sleep 5
          done
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "GitHub's pull request ref has not caught up: fetched $fetched, expected $HEAD_SHA. A rerun is safe."
            exit 1
          fi
          pin() {
            git show "$1:forge.toml" | python3 -c '
          import sys, tomllib
          try:
              print(tomllib.load(sys.stdin.buffer).get("version", ""))
          except tomllib.TOMLDecodeError as problem:
              sys.exit(f"forge.toml in this pull request is not valid TOML: {problem}. Fix it, then push again.")'
          }
          release=$(pin "$HEAD_SHA")
          if [ "$release" = "$(pin "$(git merge-base "$BASE_SHA" "$HEAD_SHA")")" ]; then
            release="v1.2.33"
          elif [[ ! "$release" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This pull request sets Forge's version in forge.toml to \"$release\", which isn't a Forge release such as v1.2.0. Set it to a Forge release, then push again." >&2
            exit 1
          fi
          echo "FORGE_RELEASE=$release" >> "$GITHUB_ENV"
      - run: uv tool install git+https://github.com/knacklabs/symphony-forge@v${FORGE_RELEASE#v}
      - id: review
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: forge hook pr-check --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" 2> "$RUNNER_TEMP/forge-pr-check.log"
      - name: Report review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_PENDING: ${{ steps.review.outputs.review-pending }}
        run: |
          if [ -f "$RUNNER_TEMP/forge-pr-check.log" ]; then
            cat "$RUNNER_TEMP/forge-pr-check.log"
          fi
          state=failure
          if [ "$REVIEW_OUTCOME" = success ]; then
            state=success
          elif [ "$REVIEW_OUTCOME" = failure ] && [ "$REVIEW_PENDING" = true ]; then
            state=pending
          fi
          job_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Review pull request") | .html_url')
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=forge-pr-check -f "state=$state" -f "target_url=$job_url" > /dev/null
          test "$state" != failure
      - name: Report pull request size
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          stats=$(git diff --numstat "$BASE_SHA...$HEAD_SHA")
          echo "$stats" | awk '{a += $1; d += $2} END {printf "Net lines: %+d (%d added, %d removed)\n", a - d, a, d}' >> "$GITHUB_STEP_SUMMARY"

  full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full test suite
    strategy:
      fail-fast: false
      matrix:
        group: [1]
    permissions:
      contents: read
      actions: read
      statuses: write
    runs-on: "ubuntu-24.04"
    env:
      UV_FROZEN: '1'
      FORGE_GROUP: ${{ matrix.group }}
      FORGE_GROUPS: '1'
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv tool install git+https://github.com/knacklabs/symphony-forge@v1.2.33
      - run: forge test --full

  full-suite-result:
    needs: full-suite
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report full test result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_RESULT: ${{ needs.full-suite.result }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          state=failure
          if [ "$FULL_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=forge-full-suite -f "state=$state" -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
