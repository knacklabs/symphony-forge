# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.2.2"
repo = "client"
stage = "live"
merge = "human"
workers = "codex"
test = "python -c \"print(123)\""
checks = ["tests", "forge-pr-check"]
interfaces = ["api/routes/**"]

[models.build]
model = "gpt-6.1-sol"
effort = "medium"

[models.fix]
model = "gpt-6.1-sol"
effort = "medium"

[models.lite]
model = "gpt-6.1-sol"
effort = "medium"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.grill.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.design.claude]
model = "claude-opus-5-5"
effort = "high"

[models.design.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.review]
model = "gpt-6.1-sol"
effort = "high"
