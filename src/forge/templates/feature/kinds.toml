[table]
list_index = 'CREATE INDEX "idx_{table}_list" ON "{schema}"."{table}" ("{org}", "{updated}" DESC, "id" DESC) WHERE "{deleted}" IS NULL;'
filter_index = 'CREATE INDEX "idx_{table}_{column}" ON "{schema}"."{table}" ("{org}", "{column}", "{updated}" DESC, "id" DESC) WHERE "{deleted}" IS NULL;'
search_index = 'CREATE INDEX "idx_{table}_{column}_search" ON "{schema}"."{table}" USING gin ("{org}", "{column}" gin_trgm_ops) WHERE "{deleted}" IS NULL;'
index = 'CREATE INDEX "idx_{table}_{column}_fk" ON "{schema}"."{table}" ("{column}");'
updated_at_trigger = 'CREATE TRIGGER "{table}_set_updated_at" BEFORE UPDATE ON "{table}" FOR EACH ROW EXECUTE FUNCTION set_updated_at();'
soft_delete_trigger = 'CREATE TRIGGER soft_delete_only BEFORE DELETE ON "{table}" FOR EACH ROW EXECUTE FUNCTION soft_delete_only();'

# Web keys: input is the form control, cell how a value shows, column whether the list shows it,
# filter_options the list filter's choices before the field's own ({Label}, {label}, {labels}).
[kinds.text]
