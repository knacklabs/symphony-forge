[table]
list_index = 'CREATE INDEX "idx_{table}_list" ON "{schema}"."{table}" ("organisationId", "updatedAtUtc" DESC, "id" DESC) WHERE "deletedAtUtc" IS NULL;'
filter_index = 'CREATE INDEX "idx_{table}_{column}" ON "{schema}"."{table}" ("organisationId", "{column}", "updatedAtUtc" DESC, "id" DESC) WHERE "deletedAtUtc" IS NULL;'
search_index = 'CREATE INDEX "idx_{table}_{column}_search" ON "{schema}"."{table}" USING gin ("organisationId", "{column}" gin_trgm_ops) WHERE "deletedAtUtc" IS NULL;'
index = 'CREATE INDEX "idx_{table}_{column}_link" ON "{schema}"."{table}" ("{column}");'
updated_at_trigger = 'CREATE TRIGGER "{table}_set_updated_at" BEFORE UPDATE ON "{table}" FOR EACH ROW EXECUTE FUNCTION set_updated_at();'
soft_delete_trigger = 'CREATE TRIGGER soft_delete_only BEFORE DELETE ON "{table}" FOR EACH ROW EXECUTE FUNCTION soft_delete_only();'

[kinds.text]
sql = "TEXT"
prisma = "String"
sqlalchemy = "Text"
check = 'CONSTRAINT "{table}_{column}_length" CHECK (char_length("{column}") BETWEEN 1 AND 200)'
sample = "Example"
changed = "Changed"
bad = ""
filter_index = false
search_index = true
index = false

