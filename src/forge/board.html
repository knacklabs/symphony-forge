<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge board</title>
<style>
  /* The Runway: near-white paper, ink, hairline rules; one amber accent that means waiting.
     No cards, shadows or rounded boxes. Colour never carries meaning alone. */
  :root {
    color-scheme: light dark;
    --paper: #fbfaf7; --ink: #1c1b19; --muted: #5d5850; --surface-2: #efede7;
    --rule: rgba(28, 27, 25, .14); --wait: #8a5300;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121211; --ink: #ecebe6; --muted: #a8a399; --surface-2: #24231f;
      --rule: rgba(236, 235, 230, .16); --wait: #e0a64a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans);
         font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  a { color: var(--ink); text-underline-offset: .15em; }
  ::selection { background: var(--ink); color: var(--paper); }
  main { padding: 1.5rem clamp(1rem, 3vw, 3rem) 3rem; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem;
           padding-bottom: .75rem; border-bottom: 1px solid var(--rule); }
  h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; }
  header p, .totals, .key, .numbers, .note, .empty, .people, .times, .status, .kind { color: var(--muted); }
  header p { font-size: .85rem; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 2.25rem 0 .5rem; }
  h3 { font-size: .9rem; font-weight: 600; margin: 1.5rem 0 .25rem; }
  .sentence { font-size: 1.15rem; margin-top: 1rem; max-width: 70ch; }
  .totals { margin-top: .4rem; font-size: .9rem; }
  .note { margin-top: 1rem; }
  .key { font-size: .85rem; margin-bottom: .5rem; white-space: nowrap; overflow-x: auto; }
  .key:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .shape { display: inline-block; width: .75em; height: .75em; margin: 0 .3em 0 .5em; vertical-align: -.05em;
           border: 1.5px solid var(--ink); background: var(--surface-2); }
  .s-done { border-radius: 50%; }
  .s-running { border-radius: 2px; }
  .s-waiting { border: 0; background: var(--muted);
               clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .s-start { transform: rotate(45deg) scale(.8); }
  .s-not { border-style: dashed; }
  .graph { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .5rem 0 1rem; }
  .detail { color: var(--muted); font-size: .85rem; }
  .row { border-top: 1px solid var(--rule); padding: .2rem 0; }
  .row:last-child { border-bottom: 1px solid var(--rule); }
  summary { cursor: pointer; padding: .4rem 0; }
  summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row > details > summary, .parts summary {
    display: grid; grid-template-columns: 1rem minmax(0, 3fr) 3rem 11rem minmax(0, 2fr);
    gap: .25rem 1rem; align-items: baseline; list-style: none; }
  .row > details > summary::-webkit-details-marker, .parts summary::-webkit-details-marker { display: none; }
  .row > details > summary::before, .parts summary::before { content: "+"; color: var(--muted); }
  .row > details[open] > summary::before, .parts details[open] > summary::before { content: "\2212"; }
  .title { font-weight: 500; }
  .kind, .status, .people, .times { font-size: .85rem; }
  .row[data-group="needs you"] .state { color: var(--wait); }
  .more { padding: 0 0 .75rem 2rem; display: grid; gap: .25rem; }
  .parts { list-style: none; padding: 0; }
  .parts li { border-top: 1px solid var(--rule); padding: .2rem 0; }
  .done { margin-top: 1.5rem; }
  .done > summary { font-weight: 600; font-size: .9rem; }
  .numbers { margin-top: 2.25rem; padding-top: .75rem; border-top: 1px solid var(--rule); font-size: .85rem; }
  .board-picture { display: block; max-width: 100%; height: auto; margin: .5rem 0;
                   color: var(--ink); font: 15px var(--sans); }
  .board-picture text { fill: currentColor; }
  .board-picture .picture-detail { fill: var(--muted); font-size: 14px; }
  .dependency-node circle, .dependency-node rect, .dependency-node polygon,
  .dependency-node ellipse, .dependency-node path { fill: var(--surface-2); stroke: currentColor; stroke-width: 1.5;
                             vector-effect: non-scaling-stroke; }
  .dependency-edge { fill: none; stroke: var(--muted); stroke-width: 1.5;
                     vector-effect: non-scaling-stroke; }
  .arrow { fill: var(--muted); }
  .recorded-time { fill: var(--ink); }
  .unknown-time { stroke: var(--muted); stroke-dasharray: 3 3; }
  @media (max-width: 720px) {
    .row > details > summary, .parts summary { grid-template-columns: 1rem minmax(0, 1fr); }
    .row > details > summary > span, .parts summary > span { grid-column: 2; }
    .more { padding-left: 1.25rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Forge board</h1>
    <p>Updated $updated</p>
  </header>
  <section id="first-screen" aria-label="Where things stand">
    $sentence
    <p class="totals">$totals</p>
    $note
  </section>
  <section id="roadmap" aria-labelledby="roadmap-heading">
    <h2 id="roadmap-heading">Roadmap</h2>
    <p class="key" tabindex="0" aria-label="Key to the map">$key</p>
    <div class="graph">$graph</div>
  </section>
  <section id="work" aria-labelledby="work-heading">
    <h2 id="work-heading">Stories and fixes</h2>
    $rows
  </section>
  <p class="numbers">$numbers</p>
</main>
</body>
</html>
