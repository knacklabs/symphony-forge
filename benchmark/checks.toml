# Fixed checks for the release score. scripts/bench_score.py runs each command in the built app's
# folder. Commands see CHECKS_DIR (benchmark/checks) and, for app checks, APP_URL (the ready address).
# kind "pass": passes on exit 0. kind "count": the last word printed is a number; 0 passes.
# baseline: files and folders next to this file; app_baseline: files and folders in the built app.
# When any of them change, the score has a new baseline and no direction is shown.
baseline = ["notes.md", "checks.toml", "checks"]
app_baseline = [".forge/design/ui-checks.js", ".claude/skills/impeccable/scripts"]

# The app runs in Docker. The script gives this run its own Compose project (BENCH_PROJECT) and a free
# port for each name in ports, so every compose command names -p $BENCH_PROJECT and `down --volumes`
# removes only this run's containers and volumes. setup runs after ready answers; the app checks wait for it.
[app]
ports = ["APP_TEST_PORT", "PRODUCTION_TEST_PORT", "ONE_COMPANY_TEST_PORT"]
start = "docker compose -p $BENCH_PROJECT -f compose.test.yml up -d --build --wait --wait-timeout 180"
ready = "http://127.0.0.1:${ONE_COMPANY_TEST_PORT}/health"
ready_timeout = 300
setup = "docker compose -p $BENCH_PROJECT -f compose.test.yml exec -T -e ADMIN_EMAIL=staff@example.test -e ADMIN_PASSWORD=bread-and-butter-1 one-company-api corepack pnpm run setup:company"
stop = "docker compose -p $BENCH_PROJECT -f compose.test.yml down --volumes"

[[check]]
name = "build"
command = "corepack pnpm run build"
kind = "pass"

[[check]]
name = "tests"
command = "node scripts/test.mjs"
kind = "pass"

[[check]]
name = "design"
command = "node \"$CHECKS_DIR/design-count.mjs\""
kind = "count"

[[check]]
name = "sign-in"
command = "node \"$CHECKS_DIR/sign-in.mjs\""
kind = "pass"
app = true

[[check]]
name = "list"
command = "node \"$CHECKS_DIR/list.mjs\""
kind = "pass"
app = true

[[check]]
name = "form"
command = "node \"$CHECKS_DIR/form.mjs\""
kind = "pass"
app = true

[[check]]
name = "dashboard"
command = "node \"$CHECKS_DIR/dashboard.mjs\""
kind = "pass"
app = true

[[check]]
name = "job"
command = "node \"$CHECKS_DIR/job.mjs\""
kind = "pass"
app = true
