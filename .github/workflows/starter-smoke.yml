name: Starter smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/starter-smoke.yml
      - src/forge/templates/**
      - src/forge/feature*.py
      - tests/test_starter_tree.py
      - tests/test_libs_layout.py

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      starter_smoke: ${{ steps.areas.outputs.starter_smoke }}
      starter_smoke_args: ${{ steps.areas.outputs.starter_smoke_args }}
      organisation_invites_smoke: ${{ steps.areas.outputs.organisation_invites_smoke }}
      organisation_invites_smoke_args: ${{ steps.areas.outputs.organisation_invites_smoke_args }}
      member_removal_smoke: ${{ steps.areas.outputs.member_removal_smoke }}
      member_removal_smoke_args: ${{ steps.areas.outputs.member_removal_smoke_args }}
      python_starter_smoke: ${{ steps.areas.outputs.python_starter_smoke }}
      python_starter_smoke_args: ${{ steps.areas.outputs.python_starter_smoke_args }}
      python_database_kinds_smoke: ${{ steps.areas.outputs.python_database_kinds_smoke }}
      python_database_kinds_smoke_args: ${{ steps.areas.outputs.python_database_kinds_smoke_args }}
      python_feature_api_smoke: ${{ steps.areas.outputs.python_feature_api_smoke }}
      python_feature_api_smoke_args: ${{ steps.areas.outputs.python_feature_api_smoke_args }}
      python_feature_history_smoke: ${{ steps.areas.outputs.python_feature_history_smoke }}
      python_feature_history_smoke_args: ${{ steps.areas.outputs.python_feature_history_smoke_args }}
      python_feature_permissions_smoke: ${{ steps.areas.outputs.python_feature_permissions_smoke }}
      python_feature_permissions_smoke_args: ${{ steps.areas.outputs.python_feature_permissions_smoke_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python scripts/smoke_select.py "$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            python scripts/smoke_select.py --all >> "$GITHUB_OUTPUT"
          fi

  starter-smoke:
    needs: select
    if: needs.select.outputs.starter_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the real starter stack and browser flows
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.starter_smoke_args }}

  organisation-invites-smoke:
    needs: select
    if: needs.select.outputs.organisation_invites_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run organisation invites against both starter stacks
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.organisation_invites_smoke_args }}

  member-removal-smoke:
    needs: select
    if: needs.select.outputs.member_removal_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the TypeScript and Python member removal flows
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.member_removal_smoke_args }}

  python-starter-smoke:
    needs: select
    if: needs.select.outputs.python_starter_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the Python starter stack and browser flows
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.python_starter_smoke_args }}

  python-database-kinds-smoke:
    needs: select
    if: needs.select.outputs.python_database_kinds_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the Python field-kind stack and browser flows
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.python_database_kinds_smoke_args }}

  python-feature-api-smoke:
    needs: select
    if: needs.select.outputs.python_feature_api_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the Python feature API stack
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.python_feature_api_smoke_args }}

  python-feature-history-smoke:
    needs: select
    if: needs.select.outputs.python_feature_history_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the Python feature history and generated tests
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.python_feature_history_smoke_args }}

  python-feature-permissions-smoke:
    needs: select
    if: needs.select.outputs.python_feature_permissions_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the Python feature permission checks
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest ${{ needs.select.outputs.python_feature_permissions_smoke_args }}
