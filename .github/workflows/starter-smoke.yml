name: Starter smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/forge/templates/starter/**
      - src/forge/templates/skeleton/Dockerfile
      - tests/test_starter_tree.py
      - .github/workflows/starter-smoke.yml

permissions:
  contents: read

jobs:
  starter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Run the real starter stack and browser flows
        env:
          FORGE_STARTER_LIVE: '1'
        run: uv run --frozen --python 3.11 pytest tests/test_starter_tree.py -q -n 0 --timeout=1800
