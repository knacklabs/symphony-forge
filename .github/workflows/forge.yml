# Generated by forge sync for Forge v1.2.38; forge sync rewrites it.
name: forge

on:
  pull_request:
  pull_request_target:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  actions: read

jobs:
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-24.04"
    outputs:
      docs-only: ${{ steps.docs.outputs.docs-only }}
      test-only: ${{ steps.docs.outputs.test-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_ONLY_EXCLUDES: '[":(exclude,glob).factory/**", ":(exclude,glob)plans/**", ":(exclude,glob).forge/**", ":(exclude,glob)docs/**", ":(exclude,glob,icase)**/*.md", ":(exclude,glob,icase)**/*.png", ":(exclude,glob,icase)**/*.jpg", ":(exclude,glob,icase)**/*.jpeg", ":(exclude,glob,icase)**/*.gif", ":(exclude,glob,icase)**/*.svg", ":(exclude,glob,icase)**/*.webp", ":(exclude,glob,icase)**/*.avif", ":(exclude,glob,icase)**/*.ico", ":(exclude,glob,icase)**/*.bmp", ":(exclude,glob,icase)**/*.tif", ":(exclude,glob,icase)**/*.tiff", ":(exclude,glob,icase)**/*.icns", ":(exclude,glob,icase)**/*.woff", ":(exclude,glob,icase)**/*.woff2", ":(exclude,glob,icase)**/*.ttf", ":(exclude,glob,icase)**/*.otf", ":(exclude,glob,icase)**/*.eot"]'
        run: python .forge/review-tests.py

  tests:
    needs: docs-check
    if: github.event_name == 'pull_request' && needs.docs-check.outputs.docs-only != 'true'
    name: test group ${{ matrix.group }} of ${{ needs.docs-check.outputs.test-only == 'true' && 1 || 6 }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.docs-check.outputs.test-only == 'true' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    runs-on: "ubuntu-24.04"
    env:
      UV_FROZEN: '1'
      FORGE_GROUP: ${{ matrix.group }}
      FORGE_GROUPS: ${{ needs.docs-check.outputs.test-only == 'true' && '1' || '6' }}
      FORGE_CONTAINERS: '1'
      # Measure every test on CI hardware before choosing a performance repair.
      PYTEST_ADDOPTS: '--durations=0'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        id: setup-uv
        continue-on-error: true
        with:
          enable-cache: true
      - uses: astral-sh/setup-uv@v6
        if: steps.setup-uv.outcome == 'failure'
        with:
          enable-cache: true
      - id: parent-tests
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_ONLY_EXCLUDES: '[":(exclude,glob).factory/**", ":(exclude,glob)plans/**", ":(exclude,glob).forge/**", ":(exclude,glob)docs/**", ":(exclude,glob,icase)**/*.md", ":(exclude,glob,icase)**/*.png", ":(exclude,glob,icase)**/*.jpg", ":(exclude,glob,icase)**/*.jpeg", ":(exclude,glob,icase)**/*.gif", ":(exclude,glob,icase)**/*.svg", ":(exclude,glob,icase)**/*.webp", ":(exclude,glob,icase)**/*.avif", ":(exclude,glob,icase)**/*.ico", ":(exclude,glob,icase)**/*.bmp", ":(exclude,glob,icase)**/*.tif", ":(exclude,glob,icase)**/*.tiff", ":(exclude,glob,icase)**/*.icns", ":(exclude,glob,icase)**/*.woff", ":(exclude,glob,icase)**/*.woff2", ":(exclude,glob,icase)**/*.ttf", ":(exclude,glob,icase)**/*.otf", ":(exclude,glob,icase)**/*.eot"]'
        run: python .forge/review-tests.py
      - uses: actions/cache@v4
        if: steps.parent-tests.outputs.reuse != 'true'
        with:
          path: ~/.npm
          key: npm-jest-30.2.0-vitest-3.2.4
      - run: uv tool install .
        if: steps.parent-tests.outputs.reuse != 'true'
      - run: "forge test --change"
        if: steps.parent-tests.outputs.reuse != 'true'

  tests-passed:
    # The one required tests check: green only when every group passed. Each event runs one of
    # tests-passed and forge-pr-check. The skipped one takes another name, because a skipped
    # job would otherwise pass a required check of the same name; always() keeps a failed
    # group from skipping this one.
    needs: [docs-check, tests]
    if: always() && github.event_name == 'pull_request'
    name: ${{ github.event_name == 'pull_request' && 'tests' || 'tests (other event)' }}
    runs-on: "ubuntu-24.04"
    steps:
      - env:
          TEST_GROUP_RESULT: ${{ needs.tests.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          DOCS_ONLY: ${{ needs.docs-check.outputs.docs-only }}
        run: test "$DOCS_CHECK" = success && { test "$TEST_GROUP_RESULT" = success || { test "$DOCS_ONLY" = true && test "$TEST_GROUP_RESULT" = skipped; }; }
      - if: needs.docs-check.outputs.docs-only == 'true'
        run: "echo 'docs only: tests skipped'"

  forge-pr-check:
    if: github.event_name == 'pull_request_target'
    name: Review pull request
    permissions:
      contents: read
      actions: read
      statuses: write
    runs-on: "ubuntu-24.04"
    steps:
      # The base branch's code and forge.toml; the pull request's commits are only data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        id: setup-uv
        continue-on-error: true
        with:
          enable-cache: true
      - uses: astral-sh/setup-uv@v6
        if: steps.setup-uv.outcome == 'failure'
        with:
          enable-cache: true
      - env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            git fetch --no-tags origin "refs/pull/$PR/head"
            fetched=$(git rev-parse FETCH_HEAD)
            [ "$fetched" = "$HEAD_SHA" ] && break
            [ "$attempt" = 7 ] || sleep 5
          done
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "GitHub's pull request ref has not caught up: fetched $fetched, expected $HEAD_SHA. A rerun is safe."
            exit 1
          fi
      - run: uv tool install .
      - id: review
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: forge hook pr-check --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" 2> "$RUNNER_TEMP/forge-pr-check.log"
      - name: Report review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_PENDING: ${{ steps.review.outputs.review-pending }}
        run: |
          if [ -f "$RUNNER_TEMP/forge-pr-check.log" ]; then
            cat "$RUNNER_TEMP/forge-pr-check.log"
          fi
          state=failure
          if [ "$REVIEW_OUTCOME" = success ]; then
            state=success
          elif [ "$REVIEW_OUTCOME" = failure ] && [ "$REVIEW_PENDING" = true ]; then
            state=pending
          fi
          if command -v gh > /dev/null; then
            job_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Review pull request") | .html_url')
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=forge-pr-check -f "state=$state" -f "target_url=$job_url" > /dev/null
          else
            # A self-hosted runner may have no gh. The same two API calls, made by the checked-out script.
            python .forge/review-tests.py status forge-pr-check "$state" "Review pull request"
          fi
          test "$state" != failure
      - name: Report pull request size
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          stats=$(git diff --numstat "$BASE_SHA...$HEAD_SHA")
          echo "$stats" | awk '{a += $1; d += $2} END {printf "Net lines: %+d (%d added, %d removed)\n", a - d, a, d}' >> "$GITHUB_STEP_SUMMARY"

  full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full test suite
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
      actions: read
      statuses: write
    runs-on: "ubuntu-24.04"
    env:
      UV_FROZEN: '1'
      FORGE_GROUP: ${{ matrix.group }}
      FORGE_GROUPS: '6'
      FORGE_CONTAINERS: '1'
      # Measure every test on CI hardware before choosing a performance repair.
      PYTEST_ADDOPTS: '--durations=0'
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        id: setup-uv
        continue-on-error: true
        with:
          enable-cache: true
      - uses: astral-sh/setup-uv@v6
        if: steps.setup-uv.outcome == 'failure'
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-jest-30.2.0-vitest-3.2.4
      - run: uv tool install .
      - run: forge test --full
        env:
          PYTEST_ADDOPTS: ${{ github.event_name == 'schedule' && '--durations=0 --store-durations --clean-durations' || '--durations=0' }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'schedule'
        with:
          name: linux-test-durations-${{ matrix.group }}
          path: .test_durations
          include-hidden-files: true
          retention-days: 7

  full-suite-result:
    needs: full-suite
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Report full test result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_RESULT: ${{ needs.full-suite.result }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          state=failure
          if [ "$FULL_RESULT" = success ]; then state=success; fi
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if command -v gh > /dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=forge-full-suite -f "state=$state" -f "target_url=$target"
          else
            # A self-hosted runner may have no gh. The token is read inside Python, never in an argument.
            python - "$state" "$target" <<'PY'
          import json, os, sys
          from urllib.request import Request, urlopen
          env = os.environ
          body = {'context': 'forge-full-suite', 'state': sys.argv[1], 'target_url': sys.argv[2]}
          urlopen(Request(f"{env.get('GITHUB_API_URL', 'https://api.github.com')}/repos/{env['GITHUB_REPOSITORY']}/statuses/{env['HEAD_SHA']}",
                          data=json.dumps(body).encode(),
                          headers={'Authorization': 'Bearer ' + env['GH_TOKEN'],
                                   'Accept': 'application/vnd.github+json',
                                   'Content-Type': 'application/json'}), timeout=60)
          PY
          fi
          test "$state" = success
