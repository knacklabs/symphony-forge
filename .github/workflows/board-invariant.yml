name: board-invariant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Require complete evidence for every done story
        run: python3 factory/scripts/check_board_complete.py
