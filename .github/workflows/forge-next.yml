name: forge-next

# The new Forge's own suite (src/forge, tests/) on every platform Forge supports.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  tests:
    env:
      FORGE_CONTAINERS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows need more runners as the suite grows; Windows also needs twice the time limit.
        include:
          - {os: ubuntu-latest, group: 1, groups: 2, timeout: 10}
          - {os: ubuntu-latest, group: 2, groups: 2, timeout: 10}
          - {os: macos-latest, group: 1, groups: 4, timeout: 10}
          - {os: macos-latest, group: 2, groups: 4, timeout: 10}
          - {os: macos-latest, group: 3, groups: 4, timeout: 10}
          - {os: macos-latest, group: 4, groups: 4, timeout: 10}
          - {os: windows-latest, group: 1, groups: 5, timeout: 20}
          - {os: windows-latest, group: 2, groups: 5, timeout: 20}
          - {os: windows-latest, group: 3, groups: 5, timeout: 20}
          - {os: windows-latest, group: 4, groups: 5, timeout: 20}
          - {os: windows-latest, group: 5, groups: 5, timeout: 20}
    runs-on: ${{ matrix.os }}
    # Give the suite time to finish and pytest-timeout time to name a slow test.
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: parent-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .forge/review-tests.py
      - uses: astral-sh/setup-uv@v6
        if: steps.parent-tests.outputs.reuse != 'true'
      # 3.11 is the oldest Python Forge supports. Parallel across the runner's cores, and split across
      # runners where one runner is too slow.
      - run: >-
          uv run --python 3.11 pytest tests -q -n auto -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread --splits ${{ matrix.groups }} --group ${{ matrix.group }}
        if: steps.parent-tests.outputs.reuse != 'true'

  net-lines:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Print the pull request's net lines
        # HEAD is the pull request merged into its base; HEAD^1 is the base.
        run: |
          git diff --numstat HEAD^1 HEAD \
            | awk '{a += $1; d += $2} END {printf "Net lines: %+d (%d added, %d removed)\n", a - d, a, d}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
