name: forge-next

# The new Forge's own suite (src/forge, tests/) on every platform Forge supports.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the suite 2-3x slower than Linux, so it takes three runners, each a third of the tests.
        include:
          - {os: ubuntu-latest, group: 1, groups: 1}
          - {os: macos-latest, group: 1, groups: 2}
          - {os: macos-latest, group: 2, groups: 2}
          - {os: windows-latest, group: 1, groups: 3}
          - {os: windows-latest, group: 2, groups: 3}
          - {os: windows-latest, group: 3, groups: 3}
    runs-on: ${{ matrix.os }}
    # Windows and macOS need time for pytest-timeout to name a slow test before the job ends.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 5 || 10 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # 3.11 is the oldest Python Forge supports. Parallel across the runner's cores, and split across
      # runners where one runner is too slow.
      - run: >-
          uv run --python 3.11 --with pytest --with pytest-xdist --with pytest-split --with pytest-timeout
          python -m pytest tests -q -n auto -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread --splits ${{ matrix.groups }} --group ${{ matrix.group }}

  net-lines:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Print the pull request's net lines
        # HEAD is the pull request merged into its base; HEAD^1 is the base.
        run: |
          git diff --numstat HEAD^1 HEAD \
            | awk '{a += $1; d += $2} END {printf "Net lines: %+d (%d added, %d removed)\n", a - d, a, d}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
