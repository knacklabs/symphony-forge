name: forge-next

# Reuse passed proof on identical merges and release tags.
# Pull requests run Linux's full suite in forge.yml and the Windows platform subset here.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A newer merge cancels the older main run; a tag, nightly or manual run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  windows-installers:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parent-tests
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW: forge-next.yml
        run: python .github/reuse-test-proof.py
      - uses: astral-sh/setup-uv@v6
        if: steps.parent-tests.outputs.reuse != 'true'
      - run: uv run --frozen --python 3.11 pytest tests/test_installers_explain_docker_start.py -q -m platform -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread
        if: steps.parent-tests.outputs.reuse != 'true'

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parent-tests
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW: forge-next.yml
        run: python .github/reuse-test-proof.py
      - uses: actions/setup-node@v4
        if: steps.parent-tests.outputs.reuse != 'true'
        with:
          node-version: '24'
      - run: npm install --global @anthropic-ai/claude-code@2.1.291
        if: steps.parent-tests.outputs.reuse != 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.parent-tests.outputs.reuse != 'true'
      - name: Check and reload the plugin through the repository test entry
        if: steps.parent-tests.outputs.reuse != 'true'
        run: uv run --frozen --python 3.11 pytest tests/test_mod_sync.py -q -k 'native-plugin-checks or real-local-install' -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread

  tests:
    # Keep these matrix checks separate from the required Linux tests check in forge.yml.
    name: ${{ matrix.os == 'windows-latest' && 'platform-sensitive tests' || 'full suite' }} on ${{ matrix.os }}, group ${{ matrix.group }} of ${{ matrix.groups }}
    env:
      FORGE_CONTAINERS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux pull request groups already run in forge.yml; Windows always runs its subset.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            {"os":"windows-latest","group":1,"groups":5},
            {"os":"windows-latest","group":2,"groups":5},
            {"os":"windows-latest","group":3,"groups":5},
            {"os":"windows-latest","group":4,"groups":5},
            {"os":"windows-latest","group":5,"groups":5}]' || '[
            {"os":"ubuntu-latest","group":1,"groups":5},
            {"os":"ubuntu-latest","group":2,"groups":5},
            {"os":"ubuntu-latest","group":3,"groups":5},
            {"os":"ubuntu-latest","group":4,"groups":5},
            {"os":"ubuntu-latest","group":5,"groups":5},
            {"os":"windows-latest","group":1,"groups":5},
            {"os":"windows-latest","group":2,"groups":5},
            {"os":"windows-latest","group":3,"groups":5},
            {"os":"windows-latest","group":4,"groups":5},
            {"os":"windows-latest","group":5,"groups":5}]') }}
    runs-on: ${{ matrix.os }}
    # Give the suite time to finish and pytest-timeout time to name a slow test.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 20 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parent-tests
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW: ${{ matrix.os == 'windows-latest' && 'forge-next.yml' || 'forge.yml' }}
        run: python .github/reuse-test-proof.py
      - uses: astral-sh/setup-uv@v6
        if: steps.parent-tests.outputs.reuse != 'true'
      - id: windows-paths
        if: runner.os == 'Windows' && steps.parent-tests.outputs.reuse != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:/t | Out-Null
          "TEMP=D:/t" >> $env:GITHUB_ENV
          "TMP=D:/t" >> $env:GITHUB_ENV
          "npm-cache=$(npm config get cache)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: runner.os == 'Windows' && steps.parent-tests.outputs.reuse != 'true'
        with:
          path: ${{ steps.windows-paths.outputs.npm-cache }}
          key: npm-${{ runner.os }}-jest-30.2.0-vitest-3.2.4
      # Save npm's cache from main on Linux: pull requests restore only caches saved from main.
      - uses: actions/cache@v4
        if: runner.os == 'Linux' && steps.parent-tests.outputs.reuse != 'true'
        with:
          path: ~/.npm
          key: npm-jest-30.2.0-vitest-3.2.4
      # Download the runners the tests start once, so no test spends its time limit on it.
      - run: |
          npm exec --yes --package=jest@30.2.0 -- jest --version
          npm exec --yes --package=vitest@3.2.4 -- vitest --version
        if: steps.parent-tests.outputs.reuse != 'true'
      # 3.11 is the oldest Python Forge supports. Parallel across the runner's cores, and split across
      # runners where one runner is too slow.
      - run: >-
          uv run --python 3.11 pytest tests -q -n auto -o faulthandler_timeout=${{ matrix.os == 'windows-latest' && 270 || 120 }} --timeout=${{ matrix.os == 'windows-latest' && 300 || 150 }} --timeout-method=thread ${{ matrix.os == 'windows-latest' && '-m platform --reruns 1 --basetemp D:/t/pytest --durations=30 --store-durations --clean-durations' || '' }} --splits ${{ matrix.groups }} --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path ${{ matrix.os == 'windows-latest' && hashFiles('.test_durations_windows') != '' && '.test_durations_windows' || '.test_durations' }}
        if: steps.parent-tests.outputs.reuse != 'true'
      # Each artifact contains only this group's measurements, ready to combine into
      # .test_durations_windows for the next dispatched run. The first run uses the Linux seed.
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && steps.parent-tests.outputs.reuse != 'true'
        with:
          name: Windows-test-durations-${{ matrix.group }}
          path: ${{ matrix.os == 'windows-latest' && hashFiles('.test_durations_windows') != '' && '.test_durations_windows' || '.test_durations' }}
          include-hidden-files: true

  net-lines:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Print the pull request's net lines
        # HEAD is the pull request merged into its base; HEAD^1 is the base.
        run: |
          git diff --numstat HEAD^1 HEAD \
            | awk '{a += $1; d += $2} END {printf "Net lines: %+d (%d added, %d removed)\n", a - d, a, d}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
