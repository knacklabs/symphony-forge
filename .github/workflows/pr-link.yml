name: pr-link

on:
  workflow_run:
    workflows: [factory-scaffold]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: pr-link-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  link-pr:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the PR body
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          {
            echo 'body<<EOF'
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .body
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Resolve the story and check the loop guard
        id: link
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "factory/scripts")
          from check_pr_ticket import TICKET_LINE, branch_ticket
          from factory_lib import repo_root
          from forge_cli.events import load_events
          from forge_cli.roadmap import load_items

          root = repo_root()
          story_keys = {
              item["key"] for item in load_items(root)
              if isinstance(item, dict) and isinstance(item.get("key"), str)
          }
          candidates = set(TICKET_LINE.findall(os.environ.get("PR_BODY", "")))
          inferred = branch_ticket(os.environ["HEAD_BRANCH"], story_keys)
          if inferred:
              candidates.add(inferred)
          candidates &= story_keys
          if len(candidates) > 1:
              raise SystemExit(
                  "PR link FAILED: multiple roadmap stories resolve: "
                  + ", ".join(sorted(candidates))
              )

          story = next(iter(candidates), "")
          reference = f"{os.environ['GITHUB_REPOSITORY']}#{os.environ['PR_NUMBER']}"
          already_linked = bool(story) and any(
              event.get("story") == story and event.get("detail") == reference
              for event in load_events(root, event="pr-linked")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"story={story}\n")
              output.write(f"reference={reference}\n")
              output.write(f"already_linked={str(already_linked).lower()}\n")
          PY
      - name: Record the PR link on the PR branch
        if: steps.link.outputs.story != '' && steps.link.outputs.already_linked != 'true'
        run: >-
          python3 factory/scripts/forge.py pr-link
          "${{ steps.link.outputs.story }}"
          "${{ steps.link.outputs.reference }}"
      - name: Commit the durable link to the PR branch
        if: steps.link.outputs.story != '' && steps.link.outputs.already_linked != 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name "forge-pr-link[bot]"
          git config user.email "forge-pr-link[bot]@users.noreply.github.com"
          git add -f .factory/events.jsonl
          # [skip ci]: the link commit touches only .factory/events.jsonl; without
          # it, the bot-attributed synchronize wave is HELD action_required and
          # strands the PR's checks (D-0017, hit on PRs #72 and #73).
          git commit -m "chore: link PR to ${{ steps.link.outputs.story }} [skip ci]"
          git push origin "HEAD:$HEAD_BRANCH"
      - name: Carry scaffold-check to the link commit
        if: steps.link.outputs.story != '' && steps.link.outputs.already_linked != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context=scaffold-check \
            -f "description=carried from $SOURCE_SHA - link commit touches only .factory/events.jsonl" \
            -f target_url="$TARGET_URL"
