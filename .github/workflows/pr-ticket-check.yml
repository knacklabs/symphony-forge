name: pr-ticket-check

on:
  # Forge branches use feat/<key>-... names, so GitHub's SHA-like-branch suppression of pull_request_target does not apply; plain pull_request is deliberately absent because it honours [skip ci].
  pull_request_target:
    # This gate reads the PR BODY, and its failure message tells you to edit
    # that body. `pull_request_target` also runs when the head commit has
    # `[skip ci]`, as used by the PR-link bot.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  pr-ticket-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch PR Git data without checking out PR files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          FETCHED_HEAD="$(git rev-parse FETCH_HEAD)"
          test "$FETCHED_HEAD" = "$HEAD_SHA"
          git update-ref refs/pr-ticket-check/head "$HEAD_SHA"
          # Fetch the current base tip because the event's base SHA goes stale as main advances.
          git fetch --no-tags origin "$BASE_REF"
          git update-ref refs/pr-ticket-check/base FETCH_HEAD
          PR_DATA_GIT_DIR="$RUNNER_TEMP/pr-ticket-check.git"
          git init --bare "$PR_DATA_GIT_DIR"
          git --git-dir="$PR_DATA_GIT_DIR" fetch --no-tags "$GITHUB_WORKSPACE/.git" \
            refs/pr-ticket-check/base:refs/pr-ticket-check/base \
            refs/pr-ticket-check/head:refs/pr-ticket-check/head
          git --git-dir="$PR_DATA_GIT_DIR" symbolic-ref HEAD refs/pr-ticket-check/head
          echo "PR_DATA_GIT_DIR=$PR_DATA_GIT_DIR" >> "$GITHUB_ENV"
      - name: Self-test the PR-ticket gate
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest factory/tests/test_gates.py -q -k "pr_ticket or gate_a"
      - name: Require exactly one completed work record
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # The checker runs from the checked-out base tree. GIT_DIR points at a
        # separate bare repository containing only base/head history, with
        # HEAD set to the PR commit for the checker's Git reads.
        run: |
          BASE_SHA="$(GIT_DIR="$PR_DATA_GIT_DIR" git merge-base refs/pr-ticket-check/base "$HEAD_SHA")"
          GIT_DIR="$PR_DATA_GIT_DIR" python3 factory/scripts/check_pr_ticket.py \
            --base "$BASE_SHA" \
            --head-branch "$HEAD_BRANCH" \
            --pr-body "$PR_BODY"
