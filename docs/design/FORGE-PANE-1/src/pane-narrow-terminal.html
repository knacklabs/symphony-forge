<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1000px; height: 250px; box-sizing: border-box; padding: 20px; background: #15171c; color: #e7e9ee; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; line-height: 22px; display: flex; flex-direction: column; gap: 14px">

  </div>
  <div style="display: flex; gap: 10px; align-items: center; color: #a4abb8"><span style="color: #e7e9ee">&gt;</span><span>the prompt stays below the frame</span></div>
</div>
