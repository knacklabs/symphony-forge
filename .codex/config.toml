#:schema https://developers.openai.com/codex/config-schema.json

# Forge-managed team model routing is committed here and in agents/*.toml.
# The user and host select the main coordinator model and reasoning.
# Terse output: artifacts and diffs carry the substance, not prose.
model_verbosity = "low"
model_reasoning_summary = "concise"
personality = "pragmatic"
# Full host access is the Forge-managed default (decision 0081). Forge's
# lifecycle, write-scope, admission, and hook controls remain authoritative.
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "cached"

[features]
hooks = true
multi_agent = true

[agents]
max_concurrent_threads_per_session = 6
max_depth = 1

[agents.architect]
config_file = "agents/architect.toml"
description = "Use for high-level system design and architecture decisions."

[agents.coder]
config_file = "agents/coder.toml"
description = "Use for server-side APIs, data, and business logic implementation."

[agents.debugger]
config_file = "agents/debugger.toml"
description = "Use for difficult diagnosis and root-cause analysis."

[agents.explorer]
config_file = "agents/explorer.toml"
description = "Use for bounded read-only codebase exploration and dependency tracing."

[agents.frontend]
config_file = "agents/frontend.toml"
description = "Use for frontend UI and UX implementation."

[agents.performance]
config_file = "agents/performance.toml"
description = "Use for performance diagnosis and measurement."

[agents.planner]
config_file = "agents/planner.toml"
description = "Use for implementation planning and contract reconciliation."

[agents.refactorer]
config_file = "agents/refactorer.toml"
description = "Use for behavior-preserving implementation refactors."

[agents.security]
config_file = "agents/security.toml"
description = "Use for security diagnosis and remediation guidance."

[agents.tester]
config_file = "agents/tester.toml"
description = "Use for writing and improving automated tests."

[agents.worker]
config_file = "agents/worker.toml"
description = "Use for bounded default implementation work."

[projects."/workspace"]
trust_level = "trusted"
