# Forge-managed team model routing is committed here and in agents/*.toml.
# The user and host select the main coordinator model and reasoning.
# Terse output: artifacts and diffs carry the substance, not prose.
model_verbosity = "low"
model_reasoning_summary = "concise"
personality = "pragmatic"
# Full host access is the Forge-managed default (decision 0049). Forge's
# lifecycle, write-scope, admission, and hook controls remain authoritative.
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "cached"

# The commands the worker runs may reach the network (decision 0068): the
# package registry and the local database, so a task can install what it
# declares and run the tests it writes. This retained workspace-write fallback
# is not the policy used by Forge-managed full-access chats.
[sandbox_workspace_write]
network_access = true

[features]
hooks = true
multi_agent = true
streamable_shell = true
skills = true

[agents]
max_threads = 6
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.planner-high]
config_file = "agents/planner-high.toml"
description = "Use for repository-grounded implementation planning."

[agents.docs-decomposer]
config_file = "agents/docs-decomposer.toml"
description = "Use for bounded decomposition from approved plans."

[agents.functional-checker]
config_file = "agents/functional-checker.toml"
description = "Use for user-visible functional verification."

[projects."/workspace"]
trust_level = "trusted"
