# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.2.23"
repo = "forge-source"
workers = "split"
merge = "agent"
test = "uv run --frozen --python 3.11 pytest tests -q -n auto -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread"
fast_test = "uv run --frozen --python 3.11 forge test --pytest {base}"
checks = ["tests", "forge-pr-check", "windows-installers"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build.codex]
model = "gpt-6.1-sol"
effort = "low"

[models.build.claude]
model = "claude-sonnet-5-5"
effort = "low"

[models.fix.codex]
model = "gpt-6.1-sol"
effort = "low"

[models.fix.claude]
model = "claude-sonnet-5-5"
effort = "low"

[models.lite.codex]
model = "gpt-6.1-sol"
effort = "low"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.lite.claude]
model = "claude-sonnet-5-5"
effort = "low"

[models.explore.codex]
model = "gpt-6.1-sol"
effort = "medium"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.explore.claude]
model = "claude-haiku-5-5"
effort = "high"

[models.grill.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.grill.claude]
model = "claude-sonnet-5-5"
effort = "high"

[models.design.claude]
model = "claude-sonnet-5-5"
effort = "high"

[models.design.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.review]
model = "gpt-6.1-sol"
effort = "high"
