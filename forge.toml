# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.0.2"
repo = "forge-source"
workers = "codex"
test = "uv run --python 3.11 --with pytest --with pytest-xdist --with pytest-timeout python -m pytest tests -q -n auto -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread"
checks = ["tests", "forge-pr-check"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "gpt-6-sol"
effort = "high"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.fix]
model = "gpt-6-sol"
effort = "high"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.lite]
model = "gpt-6-sol"
effort = "medium"

[models.grill.codex]
model = "gpt-6-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.review]
model = "gpt-6-astra"
