# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.2.0"
repo = "forge-source"
workers = "claude"
merge = "agent"
test = "uv run --python 3.11 pytest tests -q -n auto -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread"
checks = ["tests", "forge-pr-check"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "claude-opus-5-5"
effort = "medium"

[models.fix]
model = "claude-opus-5-5"
effort = "medium"

[models.lite]
model = "claude-opus-5-5"
effort = "medium"

[models.grill.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.design.claude]
model = "claude-opus-5-5"
effort = "high"

[models.design.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.review]
model = "gpt-6-sol"
effort = "high"
