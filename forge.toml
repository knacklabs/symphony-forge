# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.0.0-rc.1"
repo = "forge-source"
workers = "claude"
test = "uv run --python 3.11 --with pytest --with pytest-xdist python -m pytest tests -q -n auto"
checks = ["tests", "forge-pr-check"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "opus"
effort = "high"

[models.fix]
model = "opus"
effort = "high"

[models.lite]
model = "sonnet"
effort = "medium"

[models.grill.codex]
model = "gpt-6-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.review]
model = "gpt-6-astra"
